[[mgr.prepend_keymap]]
on   = "<Space>"
run  = "plugin remote-quicklook preview"
desc = "Quick Look (on the Mac)"

[[mgr.prepend_keymap]]
on   = "<C-r>"
run  = "plugin remote-quicklook reveal"
desc = "Reveal in Finder (on the Mac)"

[[mgr.prepend_keymap]]
on   = "i"
run  = "plugin imgview"
desc = "View image full-res (Kitty)"
