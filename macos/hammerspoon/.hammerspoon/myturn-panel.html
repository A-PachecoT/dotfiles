<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #2e3440; --line: #434c5e; --row: #3b4252; --text: #e5e9f0; --dim: #9aa3b5;
    --green: #a3be8c; --yellow: #ebcb8b; --red: #bf616a; --accent: #88c0d0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font: 14px -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--text); -webkit-user-select: none; overflow: hidden; }
  #card { position: relative; overflow: hidden; margin: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.45); padding: 12px;
    display: flex; flex-direction: column; max-height: var(--maxh, 9999px); }
  /* más tareas que pantalla: el panel tope a la pantalla y la lista scrollea */
  #list { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #list::-webkit-scrollbar { width: 6px; }
  #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .new { display: flex; gap: 8px; flex-shrink: 0; }
  .new input { flex: 1; background: var(--row); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font: inherit; padding: 9px 11px; outline: none; -webkit-user-select: text; }
  .new input:focus { border-color: var(--accent); }
  button { font: inherit; color: var(--text); background: var(--row); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  .prio { min-width: 38px; font-weight: 700; }
  .p1 { color: var(--red); } .p2 { color: var(--yellow); } .p0 { color: var(--dim); font-weight: 400; }
  .label { margin: 14px 2px 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--dim); }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; }
  .row:hover { background: rgba(255,255,255,.04); }
  .dot { width: 14px; text-align: center; font-size: 12px; color: var(--dim); }
  .waiting .dot, .waiting .say { color: var(--green); }
  .main { flex: 1; min-width: 0; }
  .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
  .title input { width: 100%; background: var(--row); border: 1px solid var(--accent); border-radius: 6px;
    color: var(--text); font: inherit; padding: 2px 6px; outline: none; -webkit-user-select: text; }
  .say { font-size: 11px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .act { min-width: 132px; }
  .waiting .act { border-color: var(--green); color: var(--green); }
  .icon { padding: 6px 8px; color: var(--dim); }
  /* cargando: barra fina arriba mientras el CLI responde; skeleton si todavía no hay nada que mostrar */
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0; transition: opacity .2s; }
  #bar.on { opacity: 1; background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 40% 100%; background-repeat: no-repeat; animation: slide 1s linear infinite; }
  @keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  .sk { height: 46px; margin: 6px 0; border-radius: 9px; background: linear-gradient(90deg, var(--row) 30%,
    #434c5e 50%, var(--row) 70%); background-size: 300% 100%; animation: shimmer 1.2s ease-in-out infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  /* teclado: fila elegida (j/k) y su botón elegido (h/l) */
  .row.sel { background: rgba(136,192,208,.10); box-shadow: inset 2px 0 0 var(--accent); }
  .row.sel .cur { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row.sel .title.cur { outline-offset: 3px; border-radius: 4px; }
  .find { display: none; margin-top: 8px; flex-shrink: 0; }
  .find.on { display: flex; }
  .find input { flex: 1; background: var(--row); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font: inherit; padding: 7px 11px; outline: none; -webkit-user-select: text; }
  .find input:focus { border-color: var(--accent); }
  kbd { font: 10px ui-monospace, monospace; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }
  .pending { opacity: .55; } .pending button { pointer-events: none; }
  .empty { color: var(--dim); padding: 18px 4px 8px; text-align: center; }
  .foot { flex-shrink: 0; margin-top: 10px; font-size: 11px; color: var(--dim); text-align: center; }
  #toast { flex-shrink: 0; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(163,190,140,.15);
    color: var(--green); display: none; text-align: center; }
</style>
</head>
<body>
<div id="card">
  <div id="bar"></div>
  <div class="new">
    <input id="new" placeholder="Nueva tarea… (n · Enter agrega · Esc vuelve a la lista)" autocomplete="off">
    <button id="newprio" class="prio p0" title="Prioridad de la nueva tarea">—</button>
  </div>
  <div class="find" id="findbox"><input id="find" placeholder="Buscar… (Enter elige · Esc limpia)" autocomplete="off"></div>
  <div id="list"></div>
  <div id="toast"></div>
  <div class="foot"><kbd>n</kbd> nueva · <kbd>f</kbd> buscar · <kbd>hjkl</kbd> moverse · <kbd>Enter</kbd>/<kbd>Espacio</kbd> elegir ·
    <kbd>Esc</kbd> vuelve a tu ventana · <kbd>⌥G</kbd> va al que te espera</div>
</div>
<script>
  const send = (m) => window.webkit.messageHandlers.myturn.postMessage(m);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const PRIO = { null: ["—", "p0"], 1: ["!1", "p1"], 2: ["!2", "p2"] };
  const nextPrio = (p) => (p == null ? 1 : p === 1 ? 2 : 0);
  let data = null, newPrio = null, editing = null;
  // teclado: fila elegida (por id, sobrevive a cada render) y columna: 0 título, 1 prioridad, 2 acción, 3 ✓, 4 ✕
  let sel = null, selIdx = 0, col = 2, query = "";
  const norm = (t) => String(t ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  function resize() { send({ action: "resize", h: Math.ceil($("#card").getBoundingClientRect().height) + 12 }); }
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.style.display = "block"; resize();
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = "none"; resize(); }, 4000);
  }

  function actionFor(r) {
    if (r.can_go) return ["go", r.state === "waiting" ? "Ir · te espera" : "Ir al agente"];
    if (r.can_resume) return ["go", "Reabrir agente"];
    return ["copy", "Copiar para Claude"];
  }

  function rowHtml(r) {
    const [ptxt, pcls] = PRIO[r.prio ?? null];
    const [act, label] = actionFor(r);
    return `<div class="row ${r.state}" data-id="${r.id}">
      <span class="dot">${r.dot}</span>
      <div class="main"><div class="title" title="Doble clic para editar">${esc(r.title)}</div>
        <div class="say">${esc(r.say)}</div></div>
      <button class="prio ${pcls}" data-do="prio" title="Cambiar prioridad">${ptxt}</button>
      <button class="act" data-do="${act}">${label}</button>
      <button class="icon" data-do="done" title="Hecha">✓</button>
      <button class="icon" data-do="archive" title="Archivar (se puede deshacer)">✕</button>
    </div>`;
  }

  window.loading = (on) => $("#bar").classList.toggle("on", on);
  window.render = (d) => {
    if (!d) { $("#list").innerHTML = `<div class="label">MIS TAREAS</div>` + `<div class="sk"></div>`.repeat(4); return; }
    data = d; if (editing) return;
    const q = norm(query), rows = q ? d.rows.filter((r) => norm(r.title).includes(q)) : d.rows;
    const waiting = rows.filter((r) => r.state === "waiting"), rest = rows.filter((r) => r.state !== "waiting");
    let h = "";
    if (waiting.length) h += `<div class="label">TE ESPERAN</div>` + waiting.map(rowHtml).join("");
    if (rest.length) h += `<div class="label">MIS TAREAS</div>` + rest.map(rowHtml).join("");
    if (!d.rows.length) h = `<div class="empty">No tienes tareas. Escribe arriba la primera.</div>`;
    else if (!rows.length) h = `<div class="empty">Nada coincide con «${esc(query)}».</div>`;
    if (!d.herdr_ok) h += `<div class="empty">herdr no responde: no veo a tus agentes.</div>`;
    $("#list").innerHTML = h; paintSel(); resize();
  };
  window.focusInput = () => { $("#new").focus(); };
  // ⌥T abre aquí: sin campo enfocado, las teclas son de la lista
  window.focusList = () => {
    query = ""; $("#find").value = ""; $("#findbox").classList.remove("on");
    sel = null; selIdx = 0; col = 2; document.activeElement?.blur(); window.render(data);
  };

  const rowEls = () => [...document.querySelectorAll("#list .row")];
  const cells = (row) => [row.querySelector(".title"), ...row.querySelectorAll("button[data-do]")];
  function paintSel() {
    const els = rowEls();
    document.querySelectorAll("#list .sel, #list .cur").forEach((x) => x.classList.remove("sel", "cur"));
    if (!els.length) return;
    let i = els.findIndex((x) => x.dataset.id === sel);
    if (i < 0) i = Math.min(selIdx, els.length - 1); // la elegida se cerró: queda la que tomó su lugar
    selIdx = i; sel = els[i].dataset.id;
    els[i].classList.add("sel"); cells(els[i])[col]?.classList.add("cur");
    els[i].scrollIntoView({ block: "nearest" });
  }
  function move(dr, dc) {
    const els = rowEls(); if (!els.length) return;
    selIdx = Math.max(0, Math.min(els.length - 1, selIdx + dr)); sel = els[selIdx].dataset.id;
    col = Math.max(0, Math.min(4, col + dc)); paintSel();
  }
  function choose() {
    const row = rowEls()[selIdx]; if (!row || row.classList.contains("pending")) return;
    const c = cells(row)[col];
    if (col === 0) startEdit(c); else c.click();
  }
  function closeFind(clear) {
    if (clear) { query = ""; $("#find").value = ""; $("#findbox").classList.remove("on"); window.render(data); }
    $("#find").blur(); resize();
  }
  window.setMaxH = (h) => { document.documentElement.style.setProperty("--maxh", `${h - 12}px`); resize(); };
  // el CLI tarda; la UI cambia ya y el próximo render del CLI la corrige si hace falta
  const drop = (id) => { data.rows = data.rows.filter((x) => x.id !== id); window.render(data); };

  $("#new").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.value.trim()) {
      send({ action: "add", title: e.target.value.trim(), prio: newPrio });
      if (data) { data.rows.unshift({ id: `tmp${Date.now()}`, title: e.target.value.trim(), prio: newPrio, state: "pending",
        dot: "○", say: "guardando…" }); window.render(data); }
      toast(`Agregada: ${e.target.value.trim()}`); e.target.value = "";
      newPrio = null; const [t, c] = PRIO[null]; $("#newprio").textContent = t; $("#newprio").className = `prio ${c}`;
    }
  });
  $("#newprio").addEventListener("click", () => {
    const n = nextPrio(newPrio); newPrio = n || null;
    const [t, c] = PRIO[newPrio]; $("#newprio").textContent = t; $("#newprio").className = `prio ${c}`;
    $("#new").focus();
  });

  $("#list").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-do]"); if (!b) return;
    const id = b.closest(".row").dataset.id, r = data.rows.find((x) => x.id === id), act = b.dataset.do;
    if (act === "prio") { const level = nextPrio(r.prio); send({ action: "prio", id, level });
      r.prio = level || null; window.render(data); }
    else if (act === "copy") { send({ action: "copy", text: r.prompt });
      toast("Copiado. Pégalo en cualquier Claude: se enlaza solo a esta tarea y aquí verás cuándo termina."); }
    else if (act === "go") send({ action: "go", id });
    else if (act === "done") { send({ action: "done", id }); drop(id); toast(`Hecha: ${r.title}`); }
    else if (act === "archive") { send({ action: "archive", id }); drop(id); toast(`Archivada: ${r.title}`); }
  });

  $("#list").addEventListener("dblclick", (e) => { const el = e.target.closest(".title"); if (el) startEdit(el); });
  function startEdit(el) {
    const id = el.closest(".row").dataset.id, r = data.rows.find((x) => x.id === id);
    editing = id; el.innerHTML = `<input value="${esc(r.title)}">`;
    const inp = el.querySelector("input"); inp.focus(); inp.select();
    const finish = (save) => {
      if (editing !== id) return; editing = null;
      if (save && inp.value.trim() && inp.value.trim() !== r.title) {
        send({ action: "edit", id, title: inp.value.trim() }); r.title = inp.value.trim();
      }
      window.render(data);
    };
    inp.addEventListener("keydown", (k) => { k.stopPropagation();
      if (k.key === "Enter") finish(true); if (k.key === "Escape") finish(false); });
    inp.addEventListener("blur", () => finish(true));
  }

  $("#find").addEventListener("input", (e) => { query = e.target.value; selIdx = 0; sel = null; window.render(data); });
  $("#find").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeFind(true); }
    else if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); closeFind(!query); }
  });
  $("#new").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); e.target.blur(); }
  });

  // el mouse no deja botones enfocados (Espacio los dispararía dos veces); el clic también mueve la selección
  $("#list").addEventListener("mousedown", (e) => {
    const row = e.target.closest(".row"); if (row) { sel = row.dataset.id; selIdx = rowEls().indexOf(row); paintSel(); }
    if (e.target.closest("button")) e.preventDefault();
  });

  // modo lista (ningún campo enfocado): n nueva, f buscar, hjkl / flechas, Enter / Espacio, Esc sale
  document.addEventListener("keydown", (e) => {
    if (editing || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "INPUT") return;
    const k = e.key, go = { j: [1, 0], ArrowDown: [1, 0], k: [-1, 0], ArrowUp: [-1, 0],
      h: [0, -1], ArrowLeft: [0, -1], l: [0, 1], ArrowRight: [0, 1] }[k];
    if (k === "Escape") send({ action: "close" });
    else if (k === "n") $("#new").focus();
    else if (k === "f") { $("#findbox").classList.add("on"); resize(); $("#find").focus(); $("#find").select(); }
    else if (go) move(...go);
    else if (k === "Enter" || k === " ") choose();
    else return;
    e.preventDefault();
  });
  window.render(data);
</script>
</body>
</html>
